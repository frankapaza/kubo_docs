name: kubo_devdocs_mobile
description: Kubo DevDocs — app móvil (MVP)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  go_router: ^13.2.0
  record: ^5.0.4
  just_audio: ^0.9.36
  path_provider: ^2.1.2
  share_plus: ^10.0.0
  intl: ^0.19.0

dependency_overrides:
  record_linux: ^1.0.0
  record_platform_interface: ^1.3.0

dev_dependencies:
  flutter_lints: ^3.0.1
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
