<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KUBO Monitoreo · Prototipo v2</title>
<style>
:root{
  --primary:#4F46E5;--primary-dark:#4338CA;--primary-light:#EEF2FF;--accent:#10B981;
  --surface:#F8FAFC;--surface2:#F1F5F9;--ink:#0F172A;--text:#1e293b;--muted:#64748B;--line:#e2e8f0;--line2:#f1f5f9;
  --ok:#047857;--ok-bg:#d1fae5;--warn:#b45309;--warn-bg:#fef3c7;--bad:#b91c1c;--bad-bg:#fee2e2;
  --route:#c2410c;--route-bg:#ffedd5;--info:#4338CA;--info-bg:#e0e7ff;--gray:#475569;--gray-bg:#f1f5f9;--maint:#6d28d9;--maint-bg:#ede9fe;
  --card:0 1px 2px 0 rgba(15,23,42,.04),0 1px 3px 0 rgba(15,23,42,.06);
  --pop:0 10px 25px -5px rgba(15,23,42,.1),0 8px 10px -6px rgba(15,23,42,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--surface);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
a{color:var(--primary);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.muted{color:var(--muted)}.small{font-size:12px}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* ===== barra del prototipo ===== */
.proto{position:sticky;top:0;z-index:100;background:#0F172A;color:#e2e8f0;display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:13px;flex-wrap:wrap}
.proto b{color:#fff;margin-right:6px}
.proto .tab{background:transparent;border:1px solid #334155;color:#cbd5e1;border-radius:999px;padding:4px 12px}
.proto .tab.on{background:var(--primary);border-color:var(--primary);color:#fff}
.proto .sp{flex:1}
.sim{position:relative}
.sim>button{background:#7c3aed;border:0;color:#fff;border-radius:999px;padding:4px 12px}
.sim-menu{position:absolute;right:0;top:34px;background:#fff;color:var(--text);border-radius:12px;box-shadow:var(--pop);padding:6px;width:330px;display:none;border:1px solid var(--line)}
.sim-menu.open{display:block}
.sim-menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px}
.sim-menu button:hover{background:var(--surface2)}
.sim-menu small{display:block;color:var(--muted);font-size:11.5px}
.sim-menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* ===== componentes comunes ===== */
.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:8px;padding:7px 12px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#cbd5e1;background:var(--surface)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-dark)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--card);padding:18px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px;color:var(--ink)}
h1{font-size:20px;margin:0;color:var(--ink)}
.sub{color:var(--muted);margin:4px 0 18px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1000px){.g3,.g4{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.kpi .n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}.kpi .l{color:var(--muted);font-size:12.5px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-ok{color:var(--ok);background:var(--ok-bg)}.b-verif{color:var(--info);background:var(--info-bg)}.b-verif::before{animation:pulse 1s infinite}
.b-deg{color:var(--warn);background:var(--warn-bg)}.b-down{color:var(--bad);background:var(--bad-bg)}.b-route{color:var(--route);background:var(--route-bg)}
.b-nodata,.b-gray{color:var(--gray);background:var(--gray-bg)}.b-maint{color:var(--maint);background:var(--maint-bg)}
@keyframes pulse{50%{opacity:.25}}
.pill{font-size:11px;padding:1px 7px;border-radius:6px;background:var(--surface2);color:var(--gray);font-weight:600;white-space:nowrap}
.pill.alta{background:var(--bad-bg);color:var(--bad)}.pill.media{background:var(--warn-bg);color:var(--warn)}
.pill.new{background:var(--primary-light);color:var(--primary)}
.probe-cell{display:flex;align-items:center;gap:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pi{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.pi.ok{background:#10B981}.pi.down{background:#ef4444}.pi.verif{background:#6366f1;animation:pulse 1s infinite}.pi.deg{background:#f59e0b}.pi.nodata{background:#94a3b8}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
input,select,textarea{font:inherit;color:var(--text);background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px}
textarea{width:100%;font-family:ui-monospace,Consolas,monospace;font-size:12px}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--warn-bg);color:#78350f}.banner.bad{background:var(--bad-bg);color:#7f1d1d}.banner.info{background:var(--primary-light);color:#312e81}
.diag{border-left:4px solid var(--route);background:var(--route-bg);padding:12px 14px;border-radius:8px;color:#7c2d12}
.diag.down{border-color:var(--bad);background:var(--bad-bg);color:#7f1d1d}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:flex;gap:12px;padding:6px 0 6px 14px;border-left:2px solid var(--line);margin-left:5px;position:relative}
.timeline li::before{content:"";position:absolute;left:-7px;top:11px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #94a3b8}
.timeline li.bad::before{border-color:#ef4444}.timeline li.ok::before{border-color:#10B981}.timeline li.tk::before{border-color:var(--primary)}
.timeline time{min-width:64px;color:var(--muted)}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--accent)}
.bar.w>i{background:#f59e0b}.bar.b>i{background:#ef4444}
dl.kv{display:grid;grid-template-columns:190px 1fr;gap:7px 12px;margin:0}dl.kv dt{color:var(--muted)}dl.kv dd{margin:0}
@media(max-width:640px){dl.kv{grid-template-columns:1fr}}
.check{display:flex;gap:8px;align-items:center;padding:5px 0}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}.warn-t{color:var(--warn)}

/* ===== central (kubo_documentacion) ===== */
.app{display:flex;min-height:calc(100vh - 41px)}
.side{width:250px;background:#fff;border-right:1px solid var(--line);flex:none;display:flex;flex-direction:column}
.side .brand{display:flex;gap:10px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line2)}
.side .brand p{margin:0}
.side nav{padding:14px 12px;display:flex;flex-direction:column;gap:2px}
.side .sec{padding:4px 12px;margin-top:12px;font-size:11px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;display:flex;gap:6px;align-items:center}
.side a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;color:#475569;font-weight:500;font-size:14px;text-decoration:none}
.side a:hover{background:var(--surface2)}
.side a.on{background:var(--primary-light);color:var(--primary-dark)}
.side a.dim{color:#94a3b8}
.side .cnt{margin-left:auto;background:#ef4444;color:#fff;border-radius:999px;font-size:11px;padding:0 7px}
.content{flex:1;min-width:0;padding:24px 28px;max-width:1280px}
@media(max-width:860px){.side{display:none}.content{padding:16px}}
.split{display:grid;grid-template-columns:1fr 340px;gap:16px}
@media(max-width:1100px){.split{grid-template-columns:1fr}}

/* ===== portal ===== */
.portal-h{background:#fff;border-bottom:1px solid var(--line)}
.portal-h .in{max-width:1024px;margin:0 auto;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.portal-h nav{display:flex;gap:18px;font-weight:500;color:#475569}
.portal-h nav span.on{color:var(--primary)}
.portal-c{max-width:1024px;margin:0 auto;padding:24px}

/* ===== escritorio Windows simulado ===== */
.desk{position:relative;height:calc(100vh - 41px);min-height:560px;overflow:hidden;background:
 radial-gradient(1200px 600px at 70% 110%,#3b82f6 0%,transparent 60%),radial-gradient(900px 500px at 20% -10%,#1e40af 0%,transparent 60%),linear-gradient(160deg,#0b1f4d,#163a8a 55%,#2563eb);}
.desk-icons{position:absolute;left:18px;top:18px;display:flex;flex-direction:column;gap:18px}
.dicon{width:78px;text-align:center;color:#fff;font-size:12px;text-shadow:0 1px 2px #000}
.dicon .ic{width:44px;height:44px;margin:0 auto 4px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.15);font-size:20px}
.desk-note{position:absolute;left:120px;top:20px;max-width:430px;background:rgba(255,255,255,.92);border-radius:12px;padding:14px 16px;font-size:13px;box-shadow:var(--pop)}
.desk-note h3{margin:0 0 6px;font-size:14px}
.desk-note ul{margin:6px 0 0;padding-left:18px}
@media(max-width:900px){.desk-note{display:none}}
.taskbar{position:absolute;left:0;right:0;bottom:0;height:48px;background:rgba(32,32,32,.85);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;color:#fff}
.taskbar .apps{display:flex;gap:6px}
.taskbar .apps span{width:36px;height:36px;border-radius:6px;display:grid;place-items:center;font-size:16px}
.taskbar .apps span:hover{background:rgba(255,255,255,.1)}
.taskbar .tray{position:absolute;right:10px;display:flex;align-items:center;gap:12px;font-size:12px;text-align:right}
.trayk{width:20px;height:20px;border-radius:5px;background:var(--primary);display:grid;place-items:center;font-size:10px;font-weight:700;position:relative;cursor:pointer}
.trayk.alert::after{content:"";position:absolute;right:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:#ef4444;border:2px solid #202020}
.tray-menu{position:absolute;right:60px;bottom:56px;background:#2b2b2b;color:#f3f3f3;border-radius:10px;padding:6px;min-width:240px;display:none;box-shadow:0 8px 32px rgba(0,0,0,.4);z-index:30}
.tray-menu.open{display:block}
.tray-menu button{display:block;width:100%;text-align:left;background:transparent;color:inherit;border:0;padding:8px 12px;border-radius:6px}
.tray-menu button:hover{background:#3a3a3a}
.tray-menu hr{border:0;border-top:1px solid #444;margin:4px 0}

/* widget */
.wg{position:absolute;width:330px;background:rgba(28,28,30,.94);backdrop-filter:blur(24px);color:#f1f5f9;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.08);font-size:13px;z-index:20;user-select:none}
.wg.tr{right:16px;top:16px}.wg.tl{left:16px;top:16px}.wg.br{right:16px;bottom:64px}.wg.bl{left:16px;bottom:64px}
.wg-h{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;border-radius:12px}
.wg-h .st{width:10px;height:10px;border-radius:50%;flex:none}
.wg-h .tt{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wg-h .tm{color:#94a3b8;font-variant-numeric:tabular-nums;font-size:12px}
.wg.ok .st{background:#22c55e}.wg.warn .st{background:#f59e0b}.wg.bad .st{background:#ef4444;animation:pulse 1.2s infinite}.wg.gray .st{background:#94a3b8}
.wg.bad{border-color:rgba(239,68,68,.6)}.wg.warn{border-color:rgba(245,158,11,.5)}
.wg-b{border-top:1px solid rgba(255,255,255,.08);padding:6px 0}
.wg-i{padding:6px 12px;display:flex;gap:8px;cursor:pointer}
.wg-i:hover{background:rgba(255,255,255,.06)}
.wg-i .ico{width:16px;flex:none;text-align:center;font-weight:700}
.wg-i .ico.bad{color:#f87171}.wg-i .ico.warn{color:#fbbf24}.wg-i .ico.route{color:#fb923c}.wg-i .ico.info{color:#a5b4fc}
.wg-i .l2{color:#94a3b8;font-size:11.5px}
.wg-msg{padding:8px 12px;color:#e2e8f0;font-size:12.5px}
.wg-f{border-top:1px solid rgba(255,255,255,.08);padding:8px 12px;display:flex;align-items:center;gap:10px;color:#94a3b8;font-size:11.5px;flex-wrap:wrap}
.wg-f .d{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
.wg-f button{margin-left:auto;background:#3a3a3c;color:#fff;border:0;border-radius:6px;padding:4px 10px;font-size:12px}
.wg-pins{display:flex;gap:2px}
.wg-pins button{background:transparent;border:0;color:#64748b;padding:0 3px;font-size:12px;margin:0}
.wg-pins button.on{color:#e2e8f0}

/* toasts Windows */
.toasts{position:fixed;right:16px;bottom:60px;z-index:200;display:flex;flex-direction:column;gap:10px;width:364px;max-width:calc(100vw - 32px)}
.toast{background:#2b2b2b;color:#f3f3f3;border-radius:10px;padding:12px 14px;box-shadow:0 8px 32px rgba(0,0,0,.45);animation:slide .25s ease-out;border-left:4px solid var(--primary)}
.toast.bad{border-left-color:#ef4444}.toast.ok{border-left-color:#22c55e}.toast.warn{border-left-color:#f59e0b}.toast.route{border-left-color:#fb923c}
.toast .tapp{font-size:11px;color:#bbb;display:flex;gap:6px;align-items:center;margin-bottom:4px}
.toast .tapp i{width:14px;height:14px;border-radius:4px;background:var(--primary);display:inline-grid;place-items:center;font-size:9px;color:#fff;font-style:normal;font-weight:700}
.toast .t{font-weight:600}.toast .b{font-size:13px;color:#ddd;margin-top:2px}
.toast button{margin-top:8px;background:#3a3a3a;color:#fff;border:0;border-radius:6px;padding:5px 12px}
.toast .x{background:none;margin:0 0 0 auto;padding:0 4px;color:#999}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.web-toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;z-index:150;font-size:13px;box-shadow:var(--pop)}
</style>
</head>
<body>

<div class="proto">
  <b>Prototipo v2</b>
  <button class="tab" data-v="pc">💻 PC de oficina (widget)</button>
  <button class="tab" data-v="central">🌐 Central · docs.kuboti.com</button>
  <button class="tab" data-v="portal">👤 Portal del cliente</button>
  <span class="sp"></span>
  <div class="sim">
    <button id="simBtn">▶ Simular evento</button>
    <div class="sim-menu" id="simMenu">
      <button onclick="sim.caida('v1')">Caída real · HTTPS portal<small>Fallan las dos sondas → incidente + ticket P1 + notificación</small></button>
      <button onclick="sim.ruta('v1')">Falla solo desde Perú · HTTPS portal<small>El servidor responde, la oficina no → «Sin acceso desde Perú»</small></button>
      <button onclick="sim.degradar('v4')">Lentitud sostenida · HTTPS app (criticidad media)<small>Solo cambia el color del widget, sin notificación</small></button>
      <button onclick="sim.disco()">Disco casi lleno · SRV-APP-01<small>El agente reporta D: con menos del 10 % libre</small></button>
      <hr>
      <button onclick="sim.oficina()">Se cae el internet de la oficina<small>Un solo aviso; la sonda guarda resultados para enviarlos después</small></button>
      <button onclick="sim.central()">La central no responde<small>El widget sigue con lo que mide la oficina</small></button>
      <hr>
      <button onclick="sim.recuperar()">✔ Recuperar todo<small>Cierra incidentes (2 comprobaciones), un aviso por recuperación</small></button>
    </div>
  </div>
</div>

<div id="view"></div>
<div class="toasts" id="toasts"></div>

<script>
/* =====================================================================
   PROTOTIPO v2 · datos de ejemplo, sin backend.
   Tiempo comprimido: los reintentos de 30 s ocurren cada 2.5 s.
   ===================================================================== */
const TZ='America/Lima';
const f=(o)=>new Intl.DateTimeFormat('es-PE',{timeZone:TZ,hour12:false,...o});
const hms=d=>f({hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date(d));
const hm=d=>f({hour:'2-digit',minute:'2-digit'}).format(new Date(d));
const dmy=d=>f({day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(d));
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STEP=2500;
const now=()=>Date.now();

/* ---------- Estado ---------- */
const clients=[{id:1,name:'Contacto Eficaz'},{id:2,name:'Cliente de ejemplo B'}];
const servers=[
  {id:'s1',client:1,name:'VMI2571371',ip:'203.0.113.25',role:'Web',provider:'Contabo',region:'EE. UU. (ejemplo)',
   agent:{st:'ok',ver:'0.1.0',cpu:22,ram:61,disks:[{u:'C:',size:200,used:151,grow:1.1},{u:'D:',size:400,used:162,grow:0.4}],
   pools:[['Portal','Iniciado'],['API','Iniciado'],['Reportes','Iniciado']],svcs:[['W3SVC (IIS)','En ejecución'],['MSSQLSERVER','En ejecución']],events:3}},
  {id:'s2',client:1,name:'VMI2429301',ip:'',role:'Base de datos',provider:'Contabo',region:'—',agent:{st:'none'}},
  {id:'s3',client:2,name:'SRV-APP-01',ip:'198.51.100.40',role:'Aplicación',provider:'Contabo',region:'Europa (ejemplo)',
   agent:{st:'ok',ver:'0.1.0',cpu:41,ram:73,disks:[{u:'C:',size:120,used:88,grow:0.3},{u:'D:',size:250,used:196,grow:2.2}],
   pools:[['App','Iniciado'],['Backoffice','Iniciado']],svcs:[['W3SVC (IIS)','En ejecución'],['MSSQLSERVER','En ejecución']],events:0}}
];
const services=[
  {id:'v1',server:'s1',name:'HTTPS portal',proto:'HTTPS',target:'https://portal.ejemplo.pe',crit:'Alta',thr:800,pe:{st:'ok',lat:212},dc:{st:'ok',lat:38}},
  {id:'v2',server:'s1',name:'TCP origen',proto:'TCP',target:'203.0.113.25:443',crit:'Alta',thr:300,pe:{st:'ok',lat:148},dc:{st:'ok',lat:3}},
  {id:'v3',server:'s1',name:'ICMP diagnóstico',proto:'ICMP',target:'203.0.113.25',crit:'Baja',thr:250,pe:{st:'ok',lat:139},dc:{st:'ok',lat:1}},
  {id:'v4',server:'s3',name:'HTTPS app',proto:'HTTPS',target:'https://app.ejemplo-b.pe',crit:'Media',thr:600,pe:{st:'ok',lat:318},dc:{st:'ok',lat:94}},
  {id:'v5',server:'s3',name:'TCP 1433 SQL',proto:'TCP',target:'198.51.100.40:1433',crit:'Media',thr:300,pe:{st:'ok',lat:231},dc:{st:'ok',lat:4}}
];
services.forEach(s=>{s.hist=Array.from({length:30},()=>Math.round(s.pe.lat*(.85+Math.random()*.3)));s.dhist=Array.from({length:30},()=>Math.max(1,Math.round(s.dc.lat*(.8+Math.random()*.4))))});
const office={internet:true,engine:true,last:now(),pending:0,ref:'1.1.1.1 18 ms · 8.8.8.8 21 ms'};
const central={up:true,last:now()};
const incidents=[]; const tickets=[]; let incSeq=12, tkSeq=1042;
// incidente histórico ya cerrado
incidents.push({id:'INC-0011',svc:'v1',kind:'route',open:false,first:now()-26*3600e3,confirmed:now()-26*3600e3+60e3,closed:now()-25.4*3600e3,
  tl:[[now()-26*3600e3,'Primer fallo desde Perú (HTTPS)','bad'],[now()-26*3600e3+60e3,'Confirmado desde Perú · el servidor KUBO responde (41 ms)','bad'],[now()-26*3600e3+90e3,'Ticket TCK-1041 creado · P1 · Mesa N1','tk'],[now()-25.4*3600e3,'Dos comprobaciones correctas · recuperado','ok']],
  ticket:'TCK-1041',notes:[{t:now()-25.5*3600e3,txt:'WinMTR muestra pérdida en el tránsito internacional del ISP. Se reportó al proveedor de la oficina.'}],evidence:[]});
tickets.push({id:'TCK-1041',prio:'P1',state:'Resuelto',assignee:'Mesa N1'});

const svc=id=>services.find(s=>s.id===id), srv=id=>servers.find(s=>s.id===id), cli=id=>clients.find(c=>c.id===id);
const cOf=s=>cli(srv(s.server).client);

const ST={ok:['Operativo','b-ok'],verif:['Verificando','b-verif'],deg:['Degradado','b-deg'],down:['Sin respuesta confirmada','b-down'],
  route:['Sin acceso desde Perú','b-route'],nodata:['Sin datos','b-nodata'],maint:['Mantenimiento','b-maint'],pending:['Configuración pendiente','b-gray']};
const badge=k=>`<span class="badge ${ST[k][1]}">${ST[k][0]}</span>`;
function combined(s){
  const p=s.pe.st,d=s.dc.st;
  if(p==='verif'||d==='verif')return 'verif';
  if(p==='down'&&d==='down')return 'down';
  if(p==='down')return 'route';
  if(p==='deg')return 'deg';
  if(p==='nodata'&&(d==='nodata'||!central.up))return 'nodata';
  return 'ok';
}
const SEV={down:5,route:4,verif:3,deg:2,nodata:1,ok:0};
function probeCell(p,isDc){
  if(isDc&&!central.up)return `<span class="probe-cell"><span class="pi nodata">?</span><span class="muted">central caída</span></span>`;
  const m={ok:['ok','✓'],down:['down','✕'],verif:['verif','…'],deg:['deg','!'],nodata:['nodata','–']}[p.st];
  const txt=p.st==='down'?'<span class="bad-t">sin respuesta</span>':p.st==='verif'?'<span class="muted">reintentando</span>':p.st==='nodata'?'<span class="muted">sin datos</span>':`${p.lat} ms`;
  return `<span class="probe-cell"><span class="pi ${m[0]}">${m[1]}</span>${txt}</span>`;
}
function diagText(k){return {down:'Fallan las dos sondas: el servicio o el servidor está caído.',route:'El servidor responde, pero no desde Perú: falla la ruta (ISP, tránsito internacional o borde de Cloudflare).',
  deg:'Responde, pero por encima de su umbral de forma sostenida.',nodata:'La oficina no está enviando mediciones.',verif:'Hubo un fallo; están en curso los reintentos de +30 s y +60 s.',ok:'Responde dentro de lo esperado.'}[k]}

/* ---------- Notificaciones ---------- */
function winToast({title,body,kind='',act,actLabel='Ver incidente'}){
  const el=document.createElement('div');el.className='toast '+kind;
  el.innerHTML=`<div class="tapp"><i>K</i>KUBO Monitoreo · ahora<button class="x" title="Cerrar">✕</button></div><div class="t">${esc(title)}</div><div class="b">${body}</div>${act?`<button class="go">${actLabel}</button>`:''}`;
  el.querySelector('.x').onclick=()=>el.remove();
  if(act)el.querySelector('.go').onclick=()=>{act();el.remove()};
  $('#toasts').prepend(el);setTimeout(()=>el.remove(),12000);
}
function webToast(msg){const el=document.createElement('div');el.className='web-toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2800)}

/* ---------- Simulación ---------- */
const sim={
  _fail(id,both){
    const s=svc(id);if(['verif','down','route'].includes(combined(s)))return;
    const t0=now();const c=cOf(s);
    s.pe.st='verif';if(both)s.dc.st='verif';render();
    const inc={id:'INC-'+String(incSeq++).padStart(4,'0'),svc:id,kind:both?'down':'route',open:false,first:t0,confirmed:null,closed:null,
      tl:[[t0,`Primer fallo ${both?'en ambas sondas':'desde Perú'} (${s.proto})`,'bad']],notes:[],evidence:[],ticket:null};
    setTimeout(()=>{inc.tl.push([t0+30e3,'Reintento +30 s fallido','bad']);render()},STEP);
    setTimeout(()=>{
      s.pe.st='down';s.dc.st=both?'down':'ok';if(!both)s.dc.lat=41;
      inc.open=true;inc.confirmed=t0+60e3;
      inc.tl.push([t0+60e3,`Reintento +60 s fallido · incidente abierto · ${both?'el servidor KUBO tampoco responde':'el servidor KUBO sí responde ('+s.dc.lat+' ms)'}`,'bad']);
      const prio={Alta:'P1',Media:'P2',Baja:'P3'}[s.crit];
      const tk={id:'TCK-'+(tkSeq++),prio,state:'Nuevo',assignee:'Mesa N1'};tickets.unshift(tk);inc.ticket=tk.id;
      inc.tl.push([t0+75e3,`Ticket ${tk.id} creado automáticamente · ${prio} · Mesa N1 · corre el SLA`,'tk']);
      incidents.unshift(inc);render();
      if(s.crit==='Alta')winToast({kind:both?'bad':'route',title:`KUBO · ${both?'Sin respuesta confirmada':'Sin acceso desde Perú'}`,
        body:`${esc(c.name)} · ${esc(s.name)}<br>${s.proto} falló tres veces desde las ${hm(t0)}. ${both?'Tampoco responde desde el servidor.':'Desde el servidor sí responde: revisar la ruta.'}<br>Ticket ${tk.id} (${prio}).`,act:()=>go('central/incidente/'+inc.id)});
    },STEP*2);
  },
  caida(id){this._fail(id,true)},
  ruta(id){this._fail(id,false)},
  degradar(id){
    const s=svc(id);let n=0;
    const tick=()=>{n++;s.pe.lat=Math.round(s.thr*1.45+Math.random()*80);s.hist.push(s.pe.lat);s.hist.shift();
      if(n===3){s.pe.st='deg';incidents.unshift({id:'INC-'+String(incSeq++).padStart(4,'0'),svc:id,kind:'deg',open:true,first:now()-2*STEP,confirmed:now(),closed:null,
        tl:[[now()-2*STEP,`Latencia ${s.pe.lat} ms (1/3)`,''],[now()-STEP,'Latencia sostenida (2/3)',''],[now(),`3 ciclos sobre ${s.thr} ms · aviso de degradación (sin ticket ni notificación)`,'bad']],notes:[],evidence:[],ticket:null})}
      render();if(n<3)setTimeout(tick,STEP/2)};
    tick();webToast('Simulando 3 ciclos lentos… (criticidad media: solo widget, sin notificación de Windows)');
  },
  disco(){
    const a=srv('s3').agent;a.disks[1].used=232;render();
    winToast({kind:'warn',title:'KUBO · Disco casi lleno',body:'Cliente de ejemplo B · SRV-APP-01<br>D: tiene 7 % libre (18 GB). A este ritmo se llena en ~8 días.',act:()=>go('central/servidores'),actLabel:'Ver servidor'});
  },
  oficina(){
    office.internet=false;office.ref='1.1.1.1 y 8.8.8.8 sin respuesta';services.forEach(s=>s.pe.st='nodata');render();
    winToast({kind:'bad',title:'KUBO · Sin internet en la oficina',body:`Fallan las referencias externas y ${services.length} destinos a la vez. Es un solo aviso: no se abren incidentes por cliente.<br>La sonda guarda los resultados y los enviará al volver.`,actLabel:'Ver salud',act:()=>go('central/sondas')});
  },
  central(){
    central.up=false;render();
    winToast({kind:'warn',title:'KUBO · La central no responde',body:'docs.kuboti.com no contesta desde la oficina. El widget sigue mostrando lo que mide esta PC y guarda los resultados para enviarlos.'});
  },
  recuperar(){
    const wasOffice=!office.internet;
    office.internet=true;office.ref='1.1.1.1 18 ms · 8.8.8.8 21 ms';central.up=true;
    services.forEach(s=>{if(s.pe.st==='nodata')s.pe.st='ok'});
    const open=incidents.filter(i=>i.open);
    open.forEach(i=>{const t=now();i.tl.push([t,'Comprobación correcta (1/2)','ok'])});
    const a=srv('s3').agent;a.disks[1].used=196;
    render();
    setTimeout(()=>{
      open.forEach(i=>{const s=svc(i.svc);const t=now();
        s.pe.st='ok';s.dc.st='ok';s.pe.lat=Math.round(s.thr*.35);s.dc.lat=Math.max(2,Math.round(s.thr*.05));
        i.open=false;i.closed=t;i.tl.push([t,'Comprobación correcta (2/2) · incidente cerrado','ok']);
        if(i.ticket){const tk=tickets.find(x=>x.id===i.ticket);tk.state='En atención';i.tl.push([t,`Nota automática en ${i.ticket}: servicio recuperado. El agente documenta la causa y cierra el ticket.`,'tk'])}
        const mins=Math.max(1,Math.round((t-i.first)/60e3));
        if(s.crit==='Alta'&&i.kind!=='deg')winToast({kind:'ok',title:'KUBO · Recuperado',body:`${esc(cOf(s).name)} · ${esc(s.name)}<br>Responde desde las ${hm(t)}. Duración observada: ${mins} min.`,act:()=>go('central/incidente/'+i.id)});
      });
      if(wasOffice||office.pending){webToast(`Enviando ${office.pending} resultados guardados a la central…`);setTimeout(()=>{office.pending=0;render()},1500)}
      render();
    },STEP);
  }
};

/* ---------- Utilidades de vista ---------- */
function spark(vals,thr,w=110,h=24,color='#4F46E5'){
  const max=Math.max(thr?thr*1.25:0,...vals,1);
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-2-(v/max)*(h-4)).toFixed(1)}`).join(' ');
  const ty=thr?(h-2-(thr/max)*(h-4)).toFixed(1):null;
  return `<svg width="${w}" height="${h}" style="display:block">${ty?`<line x1="0" x2="${w}" y1="${ty}" y2="${ty}" stroke="#f59e0b" stroke-dasharray="3 3"/>`:''}<polyline fill="none" stroke="${color}" stroke-width="1.6" points="${pts}"/></svg>`;
}
const pct=(v,d=2)=>v.toFixed(d)+' %';
function problems(){
  return services.map(s=>({s,k:combined(s)})).filter(x=>x.k!=='ok'&&x.k!=='nodata').sort((a,b)=>SEV[b.k]-SEV[a.k]);
}
function diskAlerts(){
  const out=[];servers.forEach(sv=>{if(sv.agent.st!=='ok')return;sv.agent.disks.forEach(d=>{const free=(d.size-d.used)/d.size;if(free<.15)out.push({sv,d,free})})});return out;
}

let wgPos='tr',wgOpen=false;
function widget(){
  const pr=problems();const disks=diskAlerts();
  let cls='ok',title='Todo operativo';
  if(!office.internet){cls='bad';title='Sin internet en la oficina'}
  else if(!central.up){cls='warn';title='Central no responde'}
  else if(pr.some(x=>['down','route'].includes(x.k))){cls='bad';const n=pr.filter(x=>['down','route'].includes(x.k)).length,d=pr.filter(x=>x.k==='deg').length;title=`${n} sin respuesta${d?` · ${d} degradado`:''}`}
  else if(pr.some(x=>x.k==='verif')){cls='warn';title='Verificando un fallo…'}
  else if(pr.length||disks.length){cls='warn';const d=pr.filter(x=>x.k==='deg').length;title=[d?`${d} degradado`:'',disks.length?`${disks.length} disco con poco espacio`:''].filter(Boolean).join(' · ')}
  const showBody=wgOpen||cls!=='ok';
  const icon={down:['✕','bad'],route:['✕','route'],verif:['…','info'],deg:['!','warn']};
  let body='';
  if(!office.internet)body+=`<div class="wg-msg">Fallan las referencias externas. No se abren incidentes por cliente. Guardando resultados: <b>${office.pending}</b> pendientes de envío.</div>`;
  else if(!central.up)body+=`<div class="wg-msg">docs.kuboti.com no contesta. Se muestra solo lo que mide esta PC. <b>${office.pending}</b> resultados pendientes de envío.</div>`;
  pr.forEach(({s,k})=>{const inc=incidents.find(i=>i.svc===s.id&&i.open);
    const l2=k==='deg'?`Desde Perú ${s.pe.lat} ms · umbral ${s.thr} ms`:k==='verif'?'Reintentando (+30 s / +60 s)':`Perú ✕ · Servidor ${central.up?(s.dc.st==='down'?'✕':'✓'):'?'}${inc?.ticket?' · '+inc.ticket:''}`;
    body+=`<div class="wg-i" onclick="${inc?`go('central/incidente/${inc.id}')`:`go('central/estado')`}"><span class="ico ${icon[k][1]}">${icon[k][0]}</span><div style="flex:1;min-width:0"><div>${esc(cOf(s).name)} · ${esc(s.name)} <span style="float:right;color:#94a3b8">${inc?hm(inc.first):''}</span></div><div class="l2">${l2}</div></div></div>`});
  disks.forEach(({sv,d,free})=>body+=`<div class="wg-i" onclick="go('central/servidores')"><span class="ico warn">▤</span><div><div>${esc(cli(sv.client).name)} · ${esc(sv.name)} ${d.u}</div><div class="l2">${Math.round(free*100)} % libre · se llena en ~${Math.max(1,Math.round((d.size-d.used)/d.grow))} días</div></div></div>`);
  if(!body)body=`<div class="wg-msg" style="color:#94a3b8">${services.length} servicios de ${clients.length} clientes responden con normalidad.</div>`;
  const dot=(ok,l)=>`<span><span class="d" style="background:${ok?'#22c55e':'#ef4444'}"></span>${l}</span>`;
  return `<div class="wg ${cls} ${wgPos}" id="wg">
    <div class="wg-h" onclick="wgOpen=!wgOpen;render()" title="Clic para ${showBody?'plegar':'desplegar'}"><span class="st"></span><span class="tt">KUBO · ${title}</span><span class="tm" id="wgClock">${hm(now())}</span></div>
    ${showBody?`<div class="wg-b">${body}</div>
    <div class="wg-f">${dot(office.internet,'Oficina')}${dot(central.up,'Central')}<span>${services.length} servicios</span>
      <span class="wg-pins" title="Fijar en una esquina">${[['tl','◸'],['tr','◹'],['bl','◺'],['br','◿']].map(([k,i])=>`<button class="${wgPos===k?'on':''}" onclick="event.stopPropagation();wgPos='${k}';render()">${i}</button>`).join('')}</span>
      <button onclick="go('central/estado')">Abrir tablero</button></div>`:''}
  </div>`;
}

    ${[['Caída confirmada · criticidad Alta','✔','✔','✔ P1'],['Sin acceso desde Perú · criticidad Alta','✔','✔','✔ P1'],['Recuperación de lo anterior (un aviso)','✔','✔','nota'],['Caída confirmada · criticidad Media/Baja','—','✔','✔ P2/P3'],['Degradación sostenida','—','✔','—'],['Internet de oficina caído (agrupado)','✔','✔','—'],['Central no responde','✔','✔','—'],['Disco con menos del 10 % libre (agente)','✔','✔','—'],['Fallo transitorio (un reintento respondió)','—','—','—'],['Informe mensual generado','—','—','—']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}
  </tbody></table></div><p class="muted small">Todo queda en el historial aunque no notifique. Las alertas al celular quedan para una fase posterior.</p></div>`;
}

/* =====================================================================
   VISTA 3 · Portal del cliente
   ===================================================================== */
function vPortal(){
  return `<div class="portal-h"><div class="in"><div style="display:flex;gap:12px;align-items:center">${LOGO.replace(/32/g,'28')}<div><div style="font-weight:600;color:var(--ink)">Portal de clientes</div><div class="small muted">Contacto Eficaz</div></div></div>
    <nav><span>Tickets</span><span>Requerimientos</span><span class="on">Informes</span><span>Ayuda</span><span>Salir</span></nav></div></div>
  <div class="portal-c">
   <div class="banner warn">⚠ <div><b>Pendiente de decisión:</b> ¿el cliente ve esta sección desde el piloto o después de validar los datos? El cliente nunca ve la sonda del servidor, la cobertura interna ni las IP.</div></div>
   <h1>Informe mensual · octubre 2026</h1><p class="sub">Contacto Eficaz · hora de Lima</p>
   <div class="card"><h2>Atención de tickets</h2><p class="muted" style="margin:0">(Sección existente del informe mensual: tickets, SLA de respuesta y resolución, requerimientos.)</p></div>
   <div class="card"><h2>Disponibilidad de servicios <span class="pill new">Nuevo</span></h2>${availBlock(1,true)}
   <p class="muted small" style="margin-top:14px">Medido por KUBO cada 1 a 5 minutos desde Lima y desde un servidor externo. «Acceso desde Perú» refleja la experiencia de los usuarios en Perú, incluida la red entre Perú y el servidor.</p></div>
  </div>`;
}

/* ---------- Router ---------- */
function go(h){location.hash='#/'+h}
function render(){
  const parts=location.hash.replace(/^#\//,'').split('/');const v=parts[0]||'pc';
  document.querySelectorAll('.proto .tab').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  let html;
  if(v==='central'){const p=parts[1]||'estado';
    const pages={estado:vEstado,incidentes:vIncidentes,incidente:()=>vIncidente(parts[2]),servidores:vServidores,inventario:vInventario,informes:vInformes,sondas:vSondas};
    html=centralLayout(p==='incidente'?'incidentes':p,(pages[p]||vEstado)());}
  else if(v==='portal')html=vPortal();
  else html=vPC();
  const y=window.scrollY;$('#view').innerHTML=html;window.scrollTo(0,y);
}
document.querySelectorAll('.proto .tab').forEach(b=>b.onclick=()=>go(b.dataset.v));
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
setInterval(()=>{const c=$('#wgClock');if(c)c.textContent=hm(now());const t=$('#tbClock');if(t)t.textContent=hm(now())},5000);
setInterval(()=>{
  if(office.internet&&central.up)office.last=now();else office.pending+=services.length;
  if(central.up)central.last=now();
  services.forEach(s=>{if(s.pe.st==='ok'){s.pe.lat=Math.max(20,Math.min(Math.round(s.thr*.8),Math.round(s.pe.lat*(.92+Math.random()*.16))));s.hist.push(s.pe.lat);s.hist.shift()}
    if(s.dc.st==='ok'){s.dc.lat=Math.max(1,Math.min(Math.round(s.thr*.2),Math.round(s.dc.lat*(.85+Math.random()*.3))))}});
  const a=document.activeElement;if(!(a&&['INPUT','SELECT','TEXTAREA'].includes(a.tagName)))render();
},5000);
render();
</script>
