services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/000_schema.sql:ro
      - ./backend/sql/migrations/003_ai_providers_and_signatures.sql:/docker-entrypoint-initdb.d/003_ai_providers_and_signatures.sql:ro
      - ./backend/sql/migrations/004_client_requests.sql:/docker-entrypoint-initdb.d/004_client_requests.sql:ro
      - ./backend/sql/migrations/009_attended_at.sql:/docker-entrypoint-initdb.d/009_attended_at.sql:ro
      - ./backend/sql/migrations/010_service_desk.sql:/docker-entrypoint-initdb.d/010_service_desk.sql:ro
      - ./backend/sql/migrations/011_drop_client_requests.sql:/docker-entrypoint-initdb.d/011_drop_client_requests.sql:ro
      - ./backend/sql/migrations/012_work_items.sql:/docker-entrypoint-initdb.d/012_work_items.sql:ro
      - ./backend/sql/migrations/013_portal_clientes.sql:/docker-entrypoint-initdb.d/013_portal_clientes.sql:ro
      - ./backend/sql/migrations/014_audit_client_user.sql:/docker-entrypoint-initdb.d/014_audit_client_user.sql:ro
      # workspace_settings: los ajustes del area de trabajo, con el SMTP y el
      # buzon del equipo. Solo estaban en docker-compose.dev.yml, asi que aqui
      # esa tabla no existia nunca y no habia NINGUNA forma de configurar el
      # correo: ni por panel (la fila vive en esta tabla) ni por variables.
      #
      # Van con sufijo de letra, no con numero propio, porque no son
      # migraciones numeradas; y van entre la 014 y la 015 porque la 015 anade
      # team_inbox_email a esta tabla. El orden de los tres tampoco es libre:
      # initdb ejecuta por orden alfabetico de nombre, add_workspace_settings
      # crea la tabla, add_workspace_smtp crea smtp_from y la 015 mete el buzon
      # AFTER smtp_from. Al reves, el ALTER revienta y detiene la cadena.
      - ./backend/sql/add_workspace_settings.sql:/docker-entrypoint-initdb.d/014a_add_workspace_settings.sql:ro
      - ./backend/sql/add_workspace_smtp_and_session.sql:/docker-entrypoint-initdb.d/014b_add_workspace_smtp.sql:ro
      - ./backend/sql/add_workspace_audio_retention.sql:/docker-entrypoint-initdb.d/014c_add_workspace_audio.sql:ro
      - ./backend/sql/migrations/015_notificaciones.sql:/docker-entrypoint-initdb.d/015_notificaciones.sql:ro
      - ./backend/sql/migrations/016_notify_next_attempt.sql:/docker-entrypoint-initdb.d/016_notify_next_attempt.sql:ro
      - ./backend/sql/migrations/017_plantillas_respuesta.sql:/docker-entrypoint-initdb.d/017_plantillas_respuesta.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    networks:
      - internal

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api/v1
      # Caddy es el unico proxy por delante. Sin esto, la limitacion de
      # intentos del portal contaria todas las peticiones contra la IP del
      # contenedor de Caddy y los clientes se bloquearian entre si.
      TRUST_PROXY_HOPS: 1
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: 7d
      # Secretos del portal de clientes. Deben ser distintos de los del
      # personal: JwtSecretsValidator aborta el arranque si se repiten.
      JWT_CLIENT_ACCESS_SECRET: ${JWT_CLIENT_ACCESS_SECRET}
      JWT_CLIENT_REFRESH_SECRET: ${JWT_CLIENT_REFRESH_SECRET}
      CRYPTO_SECRET: ${CRYPTO_SECRET}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /app/uploads
      AUDIO_MAX_SIZE_MB: 100
      TRANSCRIPTION_PROVIDER: whisper-api
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      WHISPER_API_BASE_URL: ${WHISPER_API_BASE_URL}
      WHISPER_MODEL: ${WHISPER_MODEL}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # SMTP de respaldo. La fuente buena es workspace_settings, que se edita
      # desde Ajustes del area de trabajo y gana siempre; esto es lo que hace
      # que el correo funcione ANTES de que nadie entre al panel. Importa
      # porque el vigilante de avisos drena cada minuto: sin ninguna de las dos
      # fuentes, cada aviso falla, gasta sus tres intentos en veinticinco
      # minutos y queda abandonado sellado con error. No es un boton que falla,
      # es una cola que se quema sola.
      #
      # Si no estan en el .env, Compose las inyecta como cadena vacia —no omite
      # la clave—, y EmailService las trata como ausentes a proposito.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      # Base de los enlaces que van dentro de los correos (ticket en el portal,
      # ticket en el panel, firma de documentos). El backend no la puede
      # deducir: las peticiones le llegan por Caddy, no desde el navegador.
      FRONTEND_URL: ${FRONTEND_URL}
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - internal

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - web
    networks:
      - internal

networks:
  internal:

volumes:
  mysql_data:
  redis_data:
  backend_uploads:
  caddy_data:
  caddy_config:
